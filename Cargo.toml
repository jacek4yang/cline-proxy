[package]
name = "cline-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["cline-proxy contributors"]
description = "A small multi-key Cline gateway for OpenAI and Anthropic clients"
license = "MIT"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
